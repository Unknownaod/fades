<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fades.lol - Signup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- ICON LIB -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Inter",sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#7c3aed22 0%,transparent 35%),
    radial-gradient(circle at bottom right,#2563eb15 0%,transparent 30%),
    radial-gradient(circle at left,#9333ea10 0%,transparent 25%);
  z-index:-2;
}

.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(circle at center, black 30%, transparent 85%);
  z-index:-1;
}

/* NAVBAR */
.navbar{
  width:100%;
  display:flex;
  justify-content:center;
  padding:24px;
}

.nav-inner{
  width:100%;
  max-width:1250px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px 18px;

  border-radius:22px;

  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);

  backdrop-filter:blur(16px);
}

.logo{
  font-size:1.2rem;
  font-weight:800;
}

.logo span{ color:#8b5cf6; }

.nav-links{
  display:flex;
  gap:38px;
  color:#9ca3af;
  font-size:.95rem;
}

.nav-links a{
  text-decoration:none;
  color:#9ca3af;
}

.nav-links a:hover{ color:white; }

.nav-buttons{
  display:flex;
  gap:12px;
}

.btn{
  padding:10px 16px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;

  display:flex;
  align-items:center;
  gap:6px;
}

.btn-dark{
  background:#111;
  color:white;
  border:1px solid rgba(255,255,255,.06);
}

.btn-purple{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:white;
}

/* WRAP */
.wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:80px 20px;
}

.card{
  width:100%;
  max-width:460px;

  padding:30px;
  border-radius:28px;

  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);

  backdrop-filter:blur(18px);
  box-shadow:0 0 60px rgba(139,92,246,.10);
}

.logo2{
  text-align:center;
  font-weight:900;
  margin-bottom:6px;
  font-size:1.3rem;
}

.logo2 span{ color:#8b5cf6; }

.subtitle{
  text-align:center;
  color:#9ca3af;
  margin-bottom:18px;
}

/* input */
.input{
  display:flex;
  align-items:center;
  gap:10px;

  padding:12px 14px;
  border-radius:16px;

  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);

  margin-bottom:10px;
}

.input i{
  width:18px;
  height:18px;
  opacity:.8;
}

.input input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:white;
}

/* button */
.submit{
  width:100%;
  padding:13px;

  border:none;
  border-radius:16px;
  cursor:pointer;

  font-weight:800;
  color:white;

  background:linear-gradient(135deg,#8b5cf6,#6d28d9);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  transition:.2s;
}

.submit:hover{
  transform:translateY(-2px);
}

/* bottom text */
.bottom{
  margin-top:12px;
  text-align:center;
  font-size:.8rem;
  color:#6b7280;
}

.bottom a{
  color:#8b5cf6;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="grid"></div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-inner">

    <div class="logo">fades<span>.lol</span></div>

    <div class="nav-links">
      <a href="#">Features</a>
      <a href="#">Themes</a>
      <a href="#">Discover</a>
      <a href="#">Discord</a>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-dark">
        <i data-lucide="log-in"></i> Login
      </button>
      <button class="btn btn-purple">
        <i data-lucide="user-plus"></i> Register
      </button>
    </div>

  </div>
</div>

<!-- SIGNUP -->
<div class="wrap">

  <div class="card">

    <div class="logo2">fades<span>.lol</span></div>
    <div class="subtitle">Create your account</div>

    <!-- USERNAME -->
    <div class="input">
      <i data-lucide="user"></i>
      <input placeholder="username">
    </div>

    <!-- EMAIL -->
    <div class="input">
      <i data-lucide="mail"></i>
      <input placeholder="email">
    </div>

    <!-- PASSWORD -->
    <div class="input">
      <i data-lucide="lock"></i>
      <input type="password" placeholder="password">
    </div>

    <button class="submit">
      <i data-lucide="user-plus"></i>
      Create account
    </button>

    <div class="bottom">
      Already have an account? <a href="/login.html">Login</a>
    </div>

  </div>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
