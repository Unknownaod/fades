<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fades.lol - Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  background: #ffffff;
  color: #111827;
}

/* NAV */
.nav {
  width: 100%;
  border-bottom: 1px solid #e5e7eb;
}

.nav-inner {
  max-width: 1000px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 700;
  font-size: 1.1rem;
}

.logo span {
  color: #3b82f6;
}

.nav-links {
  display: flex;
  gap: 18px;
  font-size: 0.95rem;
  color: #6b7280;
}

.nav-links a {
  text-decoration: none;
  color: #6b7280;
}

.nav-links a:hover {
  color: #111827;
}

.nav-actions {
  display: flex;
  gap: 10px;
}

.nav-actions a {
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.9rem;
}

.login {
  background: #f3f4f6;
  color: #111;
}

.signup {
  background: #3b82f6;
  color: white;
}

/* CENTER CARD */
.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: calc(100vh - 70px);
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 6px;
}

p {
  color: #6b7280;
  margin-bottom: 25px;
  font-size: 0.95rem;
}

/* INPUTS */
.input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  outline: none;
  font-size: 0.95rem;
}

.input:focus {
  border-color: #3b82f6;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #2563eb;
}

/* FOOTER TEXT */
.bottom {
  margin-top: 14px;
  font-size: 0.85rem;
  color: #6b7280;
}

.bottom a {
  color: #3b82f6;
  text-decoration: none;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-inner">

    <div class="logo">fades<span>.lol</span></div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="#">Features</a>
      <a href="#">Help</a>
    </div>

    <div class="nav-actions">
      <a href="/login" class="login">Login</a>
      <a href="/signup" class="signup">Sign Up</a>
    </div>

  </div>
</div>

<!-- SIGNUP -->
<div class="wrapper">
  <div class="card">

    <h1>Create account</h1>
    <p>Join fades.lol and start messaging instantly.</p>

    <form id="signupForm">
      <input class="input" name="username" placeholder="Username" required>
      <input class="input" name="email" placeholder="Email" required>
      <input class="input" name="password" type="password" placeholder="Password" required>

      <button type="submit">Sign up</button>
    </form>

    <div class="bottom">
      Already have an account? <a href="/login">Login</a>
    </div>

  </div>
</div>

<script>
const API = "https://api.fades.lol";

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.target;

  const username = form.username.value;
  const email = form.email.value;
  const password = form.password.value;

  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Signup failed");
      return;
    }

    window.location.href = "/dashboard";

  } catch (err) {
    console.error(err);
    alert("Network error");
  }
});
</script>

</body>
</html>
