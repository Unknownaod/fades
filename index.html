<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>fades.lol</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #ffffff;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    .nav {
      width: 100%;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .logo span {
      color: #3b82f6;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .login {
      background: #f3f4f6;
      color: #111;
    }

    .signup {
      background: #3b82f6;
      color: white;
    }

    /* HERO */
    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .content {
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    p {
      color: #6b7280;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .cta {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .primary {
      background: #3b82f6;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }

    /* MOBILE */
    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
      }

      .cta {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-inner">

      <div class="logo">fades<span>.lol</span></div>

      <div class="btn-group">
        <a href="/login" class="btn login">Login</a>
        <a href="/signup" class="btn signup">Sign Up</a>
      </div>

    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="content">

      <h1>Simple messaging.</h1>

      <p>
        fades.lol is a fast and clean messaging platform for chatting with friends,
        groups, and communities in real time.
      </p>

      <div class="cta">
        <a href="/signup" class="primary">Get Started</a>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    fades.lol © 2026
  </div>

</body>
</html>
