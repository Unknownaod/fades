<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fades.lol - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  height:100vh;
  display:flex;
  background:#ffffff;
  color:#111827;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  border-right:1px solid #e5e7eb;
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:14px;
  font-weight:800;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sidebar-header span{
  color:#3b82f6;
}

.search-box{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
}

.search-box input{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  outline:none;
}

.chat-list{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.empty-state{
  text-align:center;
  color:#9ca3af;
  font-size:.9rem;
  margin-top:20px;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  padding:14px;
  border-bottom:1px solid #e5e7eb;
  font-weight:600;
  min-height:52px;
  display:flex;
  align-items:center;
}

/* MESSAGES */
.messages{
  flex:1;
  position:relative;
  overflow:hidden;
  background:#000;
}

/* EMPTY CHAT FULL SCREEN */
.empty-chat{
  position:absolute;
  inset:0;

  background-image:url("/assets/Desktop.png");
  background-size:cover;
  background-position:center;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* DARK OVERLAY */
.empty-chat::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

/* CENTER CONTENT */
.empty-content{
  position:relative;
  text-align:center;
  color:white;
  max-width:420px;
  padding:20px;
}

.empty-content h2{
  font-size:1.4rem;
  margin-bottom:6px;
  font-weight:700;
}

.empty-content p{
  font-size:.95rem;
  color:#d1d5db;
  margin-bottom:18px;
}

/* BUTTONS */
.action-row{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.img-btn{
  width:130px;
  height:44px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  color:white;
  font-size:.9rem;

  transition:.2s;
}

.img-btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.15);
}

/* INPUT */
.input-bar{
  border-top:1px solid #e5e7eb;
  padding:14px;
  display:flex;
  gap:10px;
}

.input-bar input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  outline:none;
}

.input-bar button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* RIGHT PANEL */
.right{
  width:280px;
  border-left:1px solid #e5e7eb;
  padding:14px;
}

.profile-box{
  color:#9ca3af;
  font-size:.9rem;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="sidebar-header">
    fades<span>.lol</span>
    <div style="font-size:.8rem;color:#9ca3af;">online</div>
  </div>

  <div class="search-box">
    <input placeholder="Search users to start chat...">
  </div>

  <div class="chat-list">
    <div class="empty-state">No chats yet</div>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar"></div>

  <div class="messages">

    <div class="empty-chat">

      <div class="empty-content">

        <h2>Start a conversation</h2>
        <p>Search users or select a chat to begin messaging instantly.</p>

        <div class="action-row">

          <div class="img-btn" onclick="alert('users')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            </svg>
            Users
          </div>

          <div class="img-btn" onclick="alert('chats')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
            </svg>
            Chats
          </div>

        </div>

      </div>

    </div>

  </div>

  <div class="input-bar">
    <input placeholder="Message..." disabled>
    <button disabled>Send</button>
  </div>

</div>

<!-- RIGHT -->
<div class="right">
  <div class="profile-box">
    Select a chat to see profile info
  </div>
</div>

</body>
</html>
