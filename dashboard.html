<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fades.lol - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#050505;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#7c3aed22,transparent 40%),
    radial-gradient(circle at bottom,#2563eb15,transparent 40%);
  z-index:-2;
}

.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:70px 70px;
  z-index:-1;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  backdrop-filter:blur(16px);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
}
.logo span{color:#8b5cf6;}

.btn{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
}

.btn-purple{
  background:#8b5cf6;
  color:white;
}

.input{
  width:100%;
  margin-top:8px;
  margin-bottom:12px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  color:white;
  outline:none;
}

small{
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="card top">
    <div class="logo">fades<span>.lol</span> dashboard</div>
    <button class="btn btn-purple" id="saveBtn">Save</button>
  </div>

  <!-- USER INFO -->
  <div class="card">
    <h3>User</h3>
    <div><b id="username">...</b></div>
    <small id="email">...</small>
  </div>

  <!-- IDENTITY -->
  <div class="card">
    <h3>Identity</h3>

    <small>Display Name</small>
    <input class="input" id="displayName">

    <small>Bio</small>
    <input class="input" id="bio">

    <small>Avatar URL</small>
    <input class="input" id="avatar">

    <small>Banner URL</small>
    <input class="input" id="banner">

    <small>Location</small>
    <input class="input" id="location">

    <small>Status</small>
    <input class="input" id="status">
  </div>

  <!-- THEME -->
  <div class="card">
    <h3>Theme</h3>

    <small>Accent Color</small>
    <input class="input" id="accentColor">

    <small>Background Image</small>
    <input class="input" id="backgroundImage">

    <small>Blur</small>
    <input class="input" id="blur">
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <h3>Settings</h3>

    <small>Public Profile (true/false)</small>
    <input class="input" id="isPublic">
  </div>

</div>

<script>
lucide.createIcons();

const API = "https://www.api.fades.lol";

/* AUTH CHECK + LOAD USER */
async function loadUser(){

  const res = await fetch(`${API}/api/profile/me`, {
    credentials: "include"
  });

  if (!res.ok){
    window.location.href = "/login";
    return;
  }

  const user = await res.json();

  username.innerText = user.username;
  email.innerText = user.email;

  displayName.value = user.profile?.identity?.displayName || "";
  bio.value = user.profile?.identity?.bio || "";
  avatar.value = user.profile?.identity?.avatar || "";
  banner.value = user.profile?.identity?.banner || "";
  location.value = user.profile?.identity?.location || "";
  status.value = user.profile?.identity?.status || "";

  accentColor.value = user.profile?.theme?.accentColor || "#8b5cf6";
  backgroundImage.value = user.profile?.theme?.backgroundImage || "";
  blur.value = user.profile?.theme?.blur || 10;

  isPublic.value = user.settings?.isPublic ?? true;

}

/* SAVE ALL */
saveBtn.addEventListener("click", async () => {

  const body = {
    profile: {
      identity: {
        displayName: displayName.value,
        bio: bio.value,
        avatar: avatar.value,
        banner: banner.value,
        location: location.value,
        status: status.value
      },
      theme: {
        accentColor: accentColor.value,
        backgroundImage: backgroundImage.value,
        blur: Number(blur.value)
      }
    },
    settings: {
      isPublic: isPublic.value === "true"
    }
  };

  const res = await fetch(`${API}/api/profile/update`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify(body)
  });

  if (res.ok){
    alert("Saved!");
  } else {
    alert("Error saving");
  }

});

loadUser();
</script>

</body>
</html>
