<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fades.lol - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter",sans-serif;
}

body{
  background:#050505;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* glow background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#7c3aed33 0%,transparent 40%),
    radial-gradient(circle at right,#2563eb22 0%,transparent 35%),
    radial-gradient(circle at left,#9333ea22 0%,transparent 35%);
  z-index:-2;
}

.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(circle at center, black 30%, transparent 85%);
  z-index:-1;
}

/* MAIN LAYOUT */
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:rgba(10,10,10,.8);
  border-right:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(20px);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:1.3rem;
  font-weight:900;
}

.logo span{ color:#8b5cf6; }

.nav{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 12px;
  border-radius:12px;

  background:transparent;
  border:1px solid transparent;

  color:#9ca3af;
  cursor:pointer;
  transition:.2s;
}

.nav button:hover{
  background:rgba(139,92,246,.12);
  color:white;
}

.nav button.active{
  background:rgba(139,92,246,.2);
  border:1px solid rgba(139,92,246,.4);
  color:white;
}

/* MAIN AREA */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(10,10,10,.6);
  backdrop-filter:blur(20px);
}

.tabs{
  display:flex;
  gap:10px;
}

.tab{
  padding:8px 14px;
  border-radius:10px;

  border:1px solid rgba(255,255,255,.06);
  background:transparent;

  color:#9ca3af;
  cursor:pointer;
}

.tab.active{
  background:#8b5cf6;
  border:none;
  color:white;
  box-shadow:0 0 20px rgba(139,92,246,.3);
}

/* CONTENT */
.content{
  display:flex;
  flex:1;
  overflow:hidden;
}

/* LEFT PANEL */
.panel{
  width:65%;
  padding:20px;
  overflow:auto;
}

/* RIGHT PREVIEW */
.preview{
  width:35%;
  border-left:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.4);
}

/* CARD */
.card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 30px rgba(139,92,246,.05);
}

.card h3{
  margin-bottom:10px;
}

/* INPUT */
.input{
  margin-bottom:12px;
}

label{
  font-size:.8rem;
  color:#9ca3af;
  display:block;
  margin-bottom:6px;
}

input, textarea{
  width:100%;
  padding:10px 12px;
  border-radius:12px;

  border:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.4);

  color:white;
  outline:none;
}

textarea{
  height:80px;
  resize:none;
}

/* SOCIALS GRID */
.social-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.social{
  padding:10px;
  border-radius:12px;

  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.06);

  display:flex;
  align-items:center;
  gap:8px;

  cursor:pointer;
  transition:.2s;
}

.social:hover{
  border-color:#8b5cf6;
  box-shadow:0 0 15px rgba(139,92,246,.2);
}

/* SAVE BUTTON */
.save{
  width:100%;
  padding:12px;
  border:none;

  border-radius:14px;
  font-weight:800;

  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:white;

  cursor:pointer;
  box-shadow:0 0 30px rgba(139,92,246,.25);
}

/* PREVIEW CARD */
.mock{
  width:260px;
  height:520px;

  border-radius:26px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);

  padding:20px;
  text-align:center;
}

.pfp{
  width:80px;
  height:80px;
  border-radius:18px;
  background:#8b5cf6;
  margin:30px auto 10px;
  box-shadow:0 0 25px rgba(139,92,246,.4);
}

.name{
  font-weight:900;
}

.bio{
  font-size:.85rem;
  color:#9ca3af;
  margin-top:10px;
}

.badges{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}

.badge{
  font-size:.7rem;
  padding:6px 10px;
  border-radius:999px;

  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div>
      <div class="logo">fades<span>.lol</span></div>

      <div class="nav">

        <button class="active"><i data-lucide="layout"></i> Appearance</button>
        <button><i data-lucide="link"></i> Links</button>
        <button><i data-lucide="badge"></i> Badges</button>
        <button><i data-lucide="music"></i> Widgets</button>
        <button><i data-lucide="settings"></i> Settings</button>

      </div>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP -->
    <div class="topbar">

      <div class="tabs">
        <button class="tab active">Appearance</button>
        <button class="tab">Links</button>
        <button class="tab">Widgets</button>
        <button class="tab">Tracks</button>
      </div>

      <button class="tab">Save</button>

    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- LEFT -->
      <div class="panel">

        <div class="card">
          <h3>Assets</h3>

          <div class="input">
            <label>Avatar</label>
            <input placeholder="image url">
          </div>

          <div class="input">
            <label>Banner</label>
            <input placeholder="image url">
          </div>

        </div>

        <div class="card">
          <h3>Profile</h3>

          <div class="input">
            <label>Username</label>
            <input>
          </div>

          <div class="input">
            <label>Bio</label>
            <textarea></textarea>
          </div>

        </div>

        <div class="card">
          <h3>Socials</h3>

          <div class="social-grid">

            <div class="social"><i data-lucide="discord"></i> Discord</div>
            <div class="social"><i data-lucide="instagram"></i> Instagram</div>
            <div class="social"><i data-lucide="github"></i> GitHub</div>
            <div class="social"><i data-lucide="twitter"></i> X</div>
            <div class="social"><i data-lucide="youtube"></i> YouTube</div>
            <div class="social"><i data-lucide="twitch"></i> Twitch</div>
            <div class="social"><i data-lucide="spotify"></i> Spotify</div>
            <div class="social"><i data-lucide="mail"></i> Email</div>

          </div>

        </div>

        <button class="save">Save Changes</button>

      </div>

      <!-- RIGHT PREVIEW -->
      <div class="preview">

        <div class="mock">

          <div class="pfp"></div>
          <div class="name">username</div>
          <div class="bio">live preview bio</div>

          <div class="badges">
            <div class="badge">Discord</div>
            <div class="badge">GitHub</div>
            <div class="badge">Spotify</div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
